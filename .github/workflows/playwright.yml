name: Playwright E-commerce

on:
  push:
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: playwright-ecommerce:latest
          cache-from: type=gha,scope=playwright-typecheck
          cache-to: type=gha,mode=max,scope=playwright-typecheck

      - name: Run TypeScript typecheck
        run: docker run --rm playwright-ecommerce:latest npm run typecheck

  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: playwright-ecommerce:latest
          cache-from: type=gha,scope=playwright-ui
          cache-to: type=gha,mode=max,scope=playwright-ui

      - name: Prepare report directories
        run: mkdir -p playwright-report test-results

      - name: Run UI tests in Docker
        run: |
          docker run --rm \
            -e CI=true \
            -v "$PWD/playwright-report:/app/playwright-report" \
            -v "$PWD/test-results:/app/test-results" \
            playwright-ecommerce:latest \
            npx playwright test tests/ui

      - name: Upload UI test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: test-results/
          if-no-files-found: ignore

  api-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: playwright-ecommerce:latest
          cache-from: type=gha,scope=playwright-api
          cache-to: type=gha,mode=max,scope=playwright-api

      - name: Prepare report directories
        run: mkdir -p playwright-report test-results

      - name: Run API tests in Docker
        run: |
          docker run --rm \
            -e CI=true \
            -v "$PWD/playwright-report:/app/playwright-report" \
            -v "$PWD/test-results:/app/test-results" \
            playwright-ecommerce:latest \
            npx playwright test tests/api

      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: test-results/
          if-no-files-found: ignore

  integration-tests:
    if: ${{ github.event_name == 'workflow_dispatch' && vars.RUN_SUBSCRIPTION_TESTS == 'true' }}
    runs-on: ubuntu-latest

    env:
      API_URL: ${{ secrets.API_URL }}
      API_KEY: ${{ secrets.API_KEY }}
      PROJECT_URL: ${{ secrets.PROJECT_URL }}
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: playwright-ecommerce:latest
          cache-from: type=gha,scope=playwright-integration
          cache-to: type=gha,mode=max,scope=playwright-integration

      - name: Prepare report directories
        run: mkdir -p playwright-report test-results

      - name: Run integration tests in Docker
        run: |
          docker run --rm \
            -e CI=true \
            -e API_URL \
            -e API_KEY \
            -e PROJECT_URL \
            -e EMAIL \
            -e PASSWORD \
            -v "$PWD/playwright-report:/app/playwright-report" \
            -v "$PWD/test-results:/app/test-results" \
            playwright-ecommerce:latest \
            npx playwright test tests/integration

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test-results/
          if-no-files-found: ignore
